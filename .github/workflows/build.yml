name: build-unikraft-image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Unikraft CLI
        uses: unikraft/setup-action@v1
        with:
          token: ${{ secrets.UKC_TOKEN }}
          organization: boss

      - name: Remove old image to free registry storage quota
        run: |
          echo "Listing current images..."
          unikraft images list || true
          echo "Removing old image tags..."
          unikraft images rm boss/rsshub:latest || true
          unikraft images rm boss/rsshub || true

      - name: Build and push image
        run: unikraft build . --output boss/rsshub:latest

      - name: Inspect image
        run: unikraft images get boss/rsshub -o json
